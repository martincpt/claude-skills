[project]
name = "fastapi-template"
version = "0.4.1"
description = "FastAPI Template (also Swagger title)"
authors = [{name = "Martin Trapp", email = "martin.trapp@trendency.hu"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi-mail>=1.4.2",
    "fastapi[standard]>=0.115.11",
    "fire>=0.7.0",
    "prometheus-fastapi-instrumentator>=7.0.2",
    "pydantic-settings>=2.8.1",
    "pydantic[email]>=2.10.6",
    "typing-inspect>=0.9.0",
]

[project.optional-dependencies]
keycloak = [
    "fastapi-keycloak>=1.0.11",
]
fastapi-users = [
    "fastapi-users[beanie]>=14.0.1",
]
beanie = [
    "beanie>=2.0.0",
]
sqlmodel = [
    "asyncpg>=0.31.0",
    "greenlet>=3.3.1",
    "sqlalchemy>=2.0.46",
    "sqlmodel>=0.0.32",
]
ormar = [
    "ormar>=0.25.0",
]


[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fastapi-shell>=0.1.3",
    "pre-commit>=4.2.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.9",
    "mkdocstrings-python>=1.16.6",
    "mkgendocs>=0.9.2",
]
test = [
    "coverage>=7.7.0",
    "mongomock-motor>=0.0.35",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
]

[project.scripts]
run = "app:run"

[tool.setuptools]
py-modules = ["app"]

[tool.uv]
package = false

[tool.black]
line-length = 88

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002",  # Missing type annotation for *{name}
    "ANN003",  # Missing type annotation for **{name}
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in {name}
    "D104",    # Missing docstring in public package
    "D401",    # First line of docstring should be in imperative mood
    "D402",    # First line should not be the function's signature
    "D404",    # First word of the docstring should not be `This`
    "D417",    # Missing argument descriptions in Docstring (If we use type annotations, we don't need to describe the arguments)
    "DTZ005",  # The use of `datetime.datetime.now()` without tzinfo must be followed by `.replace(tzinfo=)` or `.astimezone()`
    "DTZ007",  # The use of `datetime.datetime.strptime()` without %z must be followed by `.replace(tzinfo=)` or `.astimezone()`
    "FBT001",  # Boolean positional argument in function definition
    "FBT002",  # Boolean default value in function definition
    "G004",    # Logging statement uses f-string
    "PLR0913", # Too many arguments to function call (N > 5)
    "PLW0603", # Using the global statement to update `X` is discouraged
    "PTH123",  # `open()` should be replaced by `Path.open()`
    "S101",    # Use of assert detected
    "S603",    # `subprocess` call: check for execution of untrusted input
    "S607",    # Starting a process with a partial executable path
    "SLF001",  # Private member accessed
    "TD002",   # Missing author in TODO; try: `# TODO(<author_name>): ...`
    "TD003",   # Missing issue link on the line following this TODO
    "TRY400",  # Use `logging.exception` instead of `logging.error`
    # FastAPI dependencies:
    "B008",    # Do not perform function call {name} in argument defaults; instead, perform the call within the function, or read the default from a module-level singleton variable
    # Better reading CRUD resources:
    "RUF012",  # Mutable class attributes should be annotated with typing.ClassVar
    # So we can use __all__ = [MyClass.__name__]
    "PLE0604", # Invalid object in `__all__`, must contain only strings
    # New lint rules since python 3.13
    "PLC0415", # `import` should be at the top-level of a file
    "FAST002", # FastAPI dependency without `Annotated`
    "UP046",   # Generic class `PaginatedResults` uses `Generic` subclass instead of type parameters
    "UP047",   # Generic function `inject_dependencies` should use type parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -v --durations=0 --disable-warnings --tb short"
cache_dir = ".cache/pytest_cache"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]
command_line = "-m pytest"
omit = ['tests/']

[tool.coverage.report]
show_missing = true
exclude_lines = [
    'if *TYPE_CHECKING*:$',
    'if t.TYPE_CHECKING:$',
    '\.\.\.$',
    'continue$',
    'break$',
    'pass$',
    'message = *',
    'raise *',
    'raise$',
]

[tool.coverage.xml]
output = "coverage.xml"
